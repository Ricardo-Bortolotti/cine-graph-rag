services:
  neo4j:
    image: neo4j:5.26-community
    container_name: cine-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      # Auth only via NEO4J_AUTH — NEO4J_PASSWORD becomes invalid config key PASSWORD
      NEO4J_AUTH: "${DOCKER_NEO4J_USER:-neo4j}/${DOCKER_NEO4J_PASSWORD:-password}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      # GDS powers graph analytics; APOC provides schema introspection for GraphRAG
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
      NEO4J_dbms_security_procedures_allowlist: gds.*,apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${DOCKER_NEO4J_USER:-neo4j} -p \"${DOCKER_NEO4J_PASSWORD:-password}\" 'RETURN 1;' >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - cine-net

  ollama:
    image: ollama/ollama:latest
    container_name: cine-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - cine-net
    # Uncomment if you have an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    container_name: cine-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${DOCKER_OLLAMA_MODEL:-${OLLAMA_MODEL:-llama3.2:3b}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling Ollama model: $$OLLAMA_MODEL"
        ollama pull $$OLLAMA_MODEL
        echo "Model ready."
    networks:
      - cine-net
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cine-graph-rag:latest
    container_name: cine-streamlit
    restart: unless-stopped
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      # In-network hosts. Host `uv run` still uses NEO4J_* / OLLAMA_* from .env.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${DOCKER_NEO4J_USER:-neo4j}
      NEO4J_USERNAME: ${DOCKER_NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${DOCKER_NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: ${DOCKER_NEO4J_DATABASE:-neo4j}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${DOCKER_OLLAMA_MODEL:-${OLLAMA_MODEL:-llama3.2:3b}}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      GRAPH_RAG_TOP_K: ${GRAPH_RAG_TOP_K:-25}
    volumes:
      - ./data:/app/data:ro
      - ./graph/tmdb_config.yaml:/app/graph/tmdb_config.yaml:ro
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - cine-net

networks:
  cine-net:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
