[project]
name = "cine-graph-rag"
version = "0.1.0"
description = "Explainable movie intelligence on a Neo4j knowledge graph (GraphRAG + Streamlit)"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "plotly",
    "ipykernel",
    "nbformat>=5.10.4",
    "ipywidgets>=8.1.8",
    "neo4j>=6.2.0",
    "python-dotenv>=1.2.2",
    "tqdm>=4.69.0",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "langchain-neo4j>=0.10.0",
    "langchain-ollama>=1.1.0",
    "langchain-core>=1.5.2",
    "streamlit>=1.60.0",
    "pyvis>=0.3.2",
    "networkx>=3.6.1",
    "matplotlib>=3.11.1",
]

[tool.uv]
package = false
